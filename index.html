<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneScan</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F8B8D">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F6F8; --card:#FFFFFF; --ink:#13283B; --muted:#5B6B7A; --line:#D6E0E7;
  --teal:#0F8B8D; --teal-bg:#E1F3F3; --alert:#C8102E; --alert-bg:#FDE8EB; --amber:#A65F00; --amber-bg:#FFF1D6;
  --hd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --bd:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A24; --card:#152531; --ink:#E6EEF4; --muted:#93A5B4; --line:#25394A;
    --teal:#39C0C2; --teal-bg:#123A3D; --alert:#FF7A8C; --alert-bg:#3A1720; --amber:#F2B84B; --amber-bg:#3A2A0C;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A24; --card:#152531; --ink:#E6EEF4; --muted:#93A5B4; --line:#25394A;
  --teal:#39C0C2; --teal-bg:#123A3D; --alert:#FF7A8C; --alert-bg:#3A1720; --amber:#F2B84B; --amber-bg:#3A2A0C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--bd);font-size:16px;line-height:1.45;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{font-family:var(--hd);margin:0;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hd);font-weight:700;font-size:20px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
input.f{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:6px 0 10px}
label{font-size:14px;color:var(--muted)}
.err{color:var(--alert);font-size:14px;min-height:20px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.filters button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl{position:relative;margin-top:8px}
.tl::before{content:'';position:absolute;left:15px;top:10px;bottom:10px;border-left:2px dashed var(--line)}
.rec{position:relative;padding-left:46px;margin-bottom:12px}
.node{position:absolute;left:0;top:12px;width:32px;height:22px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.rec .card{margin:0}
.rec h3{font-size:17px;margin:2px 0 4px}
.meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-right:6px}
.t-Lab{background:var(--teal-bg);color:var(--teal)}
.t-Visit{background:var(--line);color:var(--ink)}
.t-Prescription{background:var(--amber-bg);color:var(--amber)}
.rec.new .card{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-bg)}
.sum{border-left:4px solid var(--teal)}
.sum h2{font-size:18px;margin-bottom:6px}
.sum ul{margin:6px 0 0;padding-left:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs div{max-width:480px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button.on{color:var(--teal);font-weight:600}
nav.tabs button.em.on,nav.tabs button.em{color:var(--alert)}
.emg{background:var(--alert-bg);border:2px solid var(--alert)}
.emg h2{color:var(--alert);font-size:22px}
.big{font-family:var(--hd);font-size:44px;font-weight:700;color:var(--alert);line-height:1}
.pill{display:inline-block;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-weight:600}
dl{margin:10px 0 0}
dt{font-size:13px;color:var(--muted);margin-top:12px}
dd{margin:2px 0 0;font-weight:500}
.qrwrap{background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:center;margin:12px 0}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.steps p{margin:4px 0}
.ok{color:var(--teal);font-weight:600}
.banner{background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
table.ex{width:100%;border-collapse:collapse;margin:8px 0}
table.ex td{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
table.ex td:first-child{color:var(--muted);width:38%}
.login{padding-top:48px}
.login h1{font-size:34px;margin:14px 0 6px}
@media (prefers-reduced-motion: no-preference){
  .rec.new .card{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}
}

select.f,textarea.f{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:6px 0 10px}
textarea.f{min-height:80px;resize:vertical}
.ok-msg{color:var(--teal);font-weight:600;min-height:20px}
.otpbox{font-family:var(--hd);font-size:38px;font-weight:700;letter-spacing:6px;text-align:center;background:var(--paper);border-radius:10px;padding:10px;margin:8px 0}
.consent{display:flex;gap:10px;align-items:flex-start;margin:8px 0 12px;font-size:14px}
.consent input{margin-top:4px;width:18px;height:18px}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;padding:6px 0}
.danger{color:var(--alert);border-color:var(--alert)}
.log{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ====== 1. Paste your Supabase values here (Project Settings > API). Use the anon key only. ======
var SUPABASE_URL = 'https://nrmtrsrhweqaovtyxqpl.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ybXRyc3Jod2VxYW92dHl4cXBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDUxNzEsImV4cCI6MjEwNTU4MTE3MX0.lk9I_tpWiOu-hEFwUZu0--hizxKffWvNMstexgwTpSc';
// ==================================================================================================

(function(){
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var app = document.getElementById('app');
  var S = {view:'auth', step:'email', email:'', msg:'', err:'', session:null, profile:null, emergency:null, records:[], filter:'All',
           summary:'', share:null, mode:'full', logs:[], form:null, editEm:false, emDraft:null, ob:{name:'',dob:'',bg:'',cons:false}, uid:null, busy:false, doc:null};
  var timers = [];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fmt(d){ return d ? new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : ''; }
  function clear(){ timers.forEach(clearInterval); timers=[]; }
  function logo(){ return '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="#0F8B8D"/><path d="M4 13h5l2-5 3 10 2-5h6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
  var PULSE={Lab:'#0F8B8D',Visit:'#5B6B7A',Prescription:'#C77A00'};
  function node(t){ return '<div class="node"><svg width="30" height="18" viewBox="0 0 30 18" aria-hidden="true"><path d="M1 9h7l3-7 4 14 3-7h11" fill="none" stroke="'+PULSE[t]+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'; }

  function call(name, body){
    var tok = S.session ? S.session.access_token : SUPABASE_ANON_KEY;
    return fetch(SUPABASE_URL+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+tok},body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,data:j}; }); });
  }

  // ---------- data ----------
  function loadAll(){
    var uid = S.session.user.id;
    return Promise.all([
      sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
      sb.from('emergency_info').select('*').eq('patient_id',uid).maybeSingle(),
      sb.from('records').select('*').order('record_date',{ascending:false}),
      sb.from('access_logs').select('*').order('created_at',{ascending:false}).limit(10)
    ]).then(function(r){
      S.profile=r[0].data; S.emergency=r[1].data; S.records=r[2].data||[]; S.logs=r[3].data||[];
      S.view = S.profile ? (S.view==='auth'||S.view==='onboard' ? 'timeline' : S.view) : 'onboard';
      render();
    });
  }

  // ---------- views ----------
  function authView(){
    var h='<div class="login">'+logo()+'<h1>Your health records, always with you</h1><p class="muted">Sign in with your email. We send a 6-digit code, no password.</p><div class="card">';
    if(S.step==='email'){
      h+='<label for="em">Email</label><input class="f" id="em" type="email" autocomplete="email" value="'+esc(S.email)+'">'+
         '<div class="err">'+esc(S.err)+'</div><button class="btn" data-act="sendcode"'+(S.busy?' disabled':'')+'>Send code</button>';
    } else {
      h+='<p style="margin-top:0">Code sent to <strong>'+esc(S.email)+'</strong></p><label for="cd">Code from your email</label>'+
         '<input class="f" id="cd" inputmode="numeric" maxlength="10" autocomplete="one-time-code">'+
         '<div class="err">'+esc(S.err)+'</div><button class="btn" data-act="verify"'+(S.busy?' disabled':'')+'>Sign in</button>'+
         '<button class="link" data-act="changeemail">Use a different email</button>';
    }
    return h+'</div></div>';
  }

  function onboardView(){
    return '<div class="login">'+logo()+'<h1>Set up your profile</h1><div class="card">'+
      '<label for="fn">Full name</label><input class="f" id="fn" autocomplete="name" value="'+esc(S.ob.name)+'">'+
      '<label for="dob">Date of birth</label><input class="f" id="dob" type="date" value="'+esc(S.ob.dob)+'">'+
      '<label for="bg">Blood group</label><select class="f" id="bg"><option value="">Not sure</option>'+['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(function(b){return '<option'+(S.ob.bg===b?' selected':'')+'>'+b+'</option>';}).join('')+'</select>'+
      '<label class="consent"><input type="checkbox" id="cons"'+(S.ob.cons?' checked':'')+'><span>I agree that OneScan stores my health records to show me and to share them when I choose. I can delete everything anytime from the Account tab. AI summaries are not medical advice.</span></label>'+
      '<div class="err">'+esc(S.err)+'</div><button class="btn" data-act="saveprofile">Continue</button></div></div>';
  }

  function top(){ return '<div class="top"><div class="brand">'+logo()+'OneScan</div><div class="chip">'+esc(S.profile.full_name)+'</div></div>'; }

  function recList(list, showSrc){
    if(S.filter!=='All') list=list.filter(function(r){return r.record_type===S.filter;});
    if(!list.length) return '<div class="card muted">No records here yet.</div>';
    return '<div class="tl">'+list.map(function(r){
      return '<div class="rec">'+node(r.record_type)+'<div class="card"><div class="meta"><span class="tag t-'+esc(r.record_type)+'">'+esc(r.record_type)+'</span>'+fmt(r.record_date)+(showSrc?' · '+(r.source==='clinic'?'Verified by clinic':'Added by patient'):'')+'</div>'+
        '<h3>'+esc(r.title)+'</h3>'+(r.note?'<div>'+esc(r.note)+'</div>':'')+
        '<div class="meta" style="margin-top:6px">'+esc([r.doctor,r.place].filter(Boolean).join(', '))+'</div>'+
        (r.file_path?'<button class="link" data-act="viewfile" data-p="'+esc(r.file_path)+'">View photo</button>':'')+'</div></div>';
    }).join('')+'</div>';
  }
  function filters(){
    return '<div class="filters">'+['All','Lab','Visit','Prescription'].map(function(f){return '<button data-act="filter" data-f="'+f+'" class="'+(S.filter===f?'on':'')+'">'+f+'</button>';}).join('')+'</div>';
  }

  function timelineView(){
    return '<h2 style="margin:6px 0">Timeline</h2><div class="card sum"><h2>Summary</h2>'+
      (S.summary?'<div style="white-space:pre-wrap">'+esc(S.summary)+'</div><p class="meta" style="margin:8px 0 0">AI generated from your records. Not medical advice.</p>':
       '<p class="muted" style="margin:0 0 8px">Get a short overview of your history.</p>')+
      '<button class="btn alt" data-act="summarize"'+(S.busy?' disabled':'')+' style="margin-top:8px">'+(S.busy?'Working...':(S.summary?'Refresh summary':'Summarize with AI'))+'</button></div>'+
      filters()+recList(S.records,false);
  }

  function addView(){
    var f=S.form, h='<h2 style="margin:6px 0">Add a record</h2><div class="card"><p style="margin-top:0">Photograph a report or prescription and OneScan fills in the details. You can fix anything before saving.</p>'+
      '<div class="row"><label class="btn" style="text-align:center;cursor:pointer">Take or choose photo<input type="file" accept="image/*" data-act="photo" hidden></label>'+
      '<button class="btn alt" data-act="manual">Type it in</button></div><div class="ok-msg" id="okm" aria-live="polite">'+esc(S.msg)+'</div>'+(f?'':'<div class="err">'+esc(S.err)+'</div>')+'</div>';
    if(S.busy&&!f) h+='<div class="card" aria-live="polite">Reading your photo...</div>';
    if(f){
      h+='<div class="card"><label for="f_d">Date</label><input class="f" id="f_d" type="date" value="'+esc(f.record_date)+'">'+
        '<label for="f_t">Type</label><select class="f" id="f_t">'+['Lab','Visit','Prescription'].map(function(t){return '<option'+(f.record_type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select>'+
        '<label for="f_ti">Title</label><input class="f" id="f_ti" value="'+esc(f.title)+'">'+
        '<label for="f_do">Doctor</label><input class="f" id="f_do" value="'+esc(f.doctor)+'">'+
        '<label for="f_pl">Hospital or lab</label><input class="f" id="f_pl" value="'+esc(f.place)+'">'+
        '<label for="f_n">Notes and results</label><textarea class="f" id="f_n">'+esc(f.note)+'</textarea>'+
        '<div class="err">'+esc(S.err)+'</div><button class="btn" data-act="saverec"'+(S.busy?' disabled':'')+'>Save record</button></div>';
    }
    return h;
  }

  function emItems(a){ return (a||[]).map(function(x){return '<span class="pill">'+esc(x)+'</span>';}).join('')||'<span class="muted">Not added</span>'; }
  function emCard(p,e){
    e=e||{};
    return '<div class="card emg"><h2>Emergency information</h2><dl><dt>Blood group</dt><dd><span class="big">'+esc((p&&p.blood_group)||'?')+'</span></dd>'+
      '<dt>Allergies</dt><dd>'+emItems(e.allergies)+'</dd><dt>Conditions</dt><dd>'+((e.conditions||[]).map(esc).join('<br>')||'<span class="muted">Not added</span>')+'</dd>'+
      '<dt>Current medicines</dt><dd>'+((e.medications||[]).map(esc).join('<br>')||'<span class="muted">Not added</span>')+'</dd>'+
      '<dt>Emergency contact</dt><dd>'+(esc([e.contact_name,e.contact_phone].filter(Boolean).join(', '))||'<span class="muted">Not added</span>')+'</dd></dl></div>';
  }
  function emergencyView(){
    var e=(S.editEm&&S.emDraft)||S.emergency||{}, h='<h2 style="margin:6px 0">Emergency</h2><p class="muted" style="margin-top:0">This is all a responder sees from your emergency QR.</p>'+emCard(S.profile,S.emergency);
    if(!S.editEm) return h+'<button class="btn alt" data-act="editem">Edit emergency details</button>';
    return h+'<div class="card"><label for="e_a">Allergies (separate with commas)</label><input class="f" id="e_a" value="'+esc((e.allergies||[]).join(', '))+'">'+
      '<label for="e_c">Conditions (commas)</label><input class="f" id="e_c" value="'+esc((e.conditions||[]).join(', '))+'">'+
      '<label for="e_m">Current medicines (commas)</label><input class="f" id="e_m" value="'+esc((e.medications||[]).join(', '))+'">'+
      '<label for="e_n">Contact name</label><input class="f" id="e_n" value="'+esc(e.contact_name||'')+'">'+
      '<label for="e_p">Contact phone</label><input class="f" id="e_p" inputmode="tel" value="'+esc(e.contact_phone||'')+'">'+
      '<div class="err">'+esc(S.err)+'</div><div class="row"><button class="btn" data-act="saveem">Save</button><button class="btn alt" data-act="cancelem">Cancel</button></div></div>';
  }

  function shareView(){
    var s=S.share, h='<h2 style="margin:6px 0">Share</h2><div class="card"><div class="seg">'+
      '<button data-act="mode" data-m="full" class="'+(S.mode==='full'?'on':'')+'">Full history</button><button data-act="mode" data-m="emergency" class="'+(S.mode==='emergency'?'on':'')+'">Emergency only</button></div>'+
      '<p class="small muted" style="margin:4px 0 10px">'+(S.mode==='full'?'The doctor scans the QR and enters a 6-digit code that only you can see. Valid for 10 minutes, read-only.':'Shows blood group, allergies, medicines and contact. No records. Valid for 24 hours.')+'</p>'+
      '<button class="btn" data-act="genqr"'+(S.busy?' disabled':'')+'>'+(s?'Make a new QR':'Generate QR')+'</button><div class="err">'+esc(S.err)+'</div>';
    if(s){
      h+='<div class="qrwrap"><div id="qrbox" role="img" aria-label="QR code"></div></div>';
      if(s.otp) h+='<p class="small" style="text-align:center;margin:0">Tell the doctor this code</p><div class="otpbox" aria-label="Code">'+esc(s.otp)+'</div>';
      h+='<p class="small" style="text-align:center;margin:0">Expires in <strong id="cd">--</strong></p>';
    }
    h+='</div><div class="card"><h3 style="font-size:18px;margin-bottom:6px">Who opened your records</h3>'+
      (S.logs.length?S.logs.map(function(l){return '<div class="log">'+new Date(l.created_at).toLocaleString('en-IN')+' · '+(l.mode==='full'?'Full':'Emergency')+' · '+({opened:'Opened',wrong_otp:'Wrong code',expired:'Expired link',locked:'Locked'}[l.outcome]||l.outcome)+'</div>';}).join(''):'<p class="muted small" style="margin:0">Nobody yet.</p>')+'</div>';
    return h;
  }

  function accountView(){
    return '<h2 style="margin:6px 0">Account</h2><div class="card"><p style="margin-top:0">Signed in as <strong>'+esc(S.session.user.email)+'</strong></p>'+
      '<button class="btn alt" data-act="signout">Sign out</button></div>'+
      '<div class="card"><h3 style="font-size:18px">Delete everything</h3><p class="small muted">This erases your account, every record and every photo. It cannot be undone.</p>'+
      '<button class="btn alt danger" data-act="delete">Delete my account</button></div>'+
      '<p class="meta">AI summaries and photo reading are not medical advice. In an emergency call 108.</p>';
  }

  function nav(){
    var it=[['timeline','Timeline','M4 6h16M4 12h16M4 18h10'],['add','Add','M12 5v14M5 12h14'],['share','Share','M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM19 19h1'],['emergency','Emergency','M12 3l9 16H3z M12 10v4 M12 17v.5'],['account','Account','M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0']];
    return '<nav class="tabs" aria-label="Main"><div>'+it.map(function(i){return '<button data-act="nav" data-to="'+i[0]+'" class="'+(S.view===i[0]?'on ':'')+(i[0]==='emergency'?'em':'')+'"'+(S.view===i[0]?' aria-current="page"':'')+'><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+i[2]+'"/></svg>'+i[1]+'</button>';}).join('')+'</div></nav>';
  }

  // ---------- doctor page (opened from a QR) ----------
  function doctorView(){
    var d=S.doc;
    if(d.state==='loading') return '<div class="login">'+logo()+'<h1>Opening...</h1></div>';
    if(d.state==='error') return '<div class="login">'+logo()+'<h1>Cannot open</h1><div class="card">'+esc(d.error)+'</div></div>';
    if(d.state==='otp') return '<div class="login">'+logo()+'<h1>Enter the patient\'s code</h1><p class="muted">Ask the patient for the 6-digit code shown on their phone.</p><div class="card">'+
      '<label for="dotp">6-digit code</label><input class="f" id="dotp" inputmode="numeric" maxlength="6" autocomplete="off"><div class="err">'+esc(d.error||'')+'</div><button class="btn" data-act="docopen">Open records</button></div></div>';
    var r=d.data;
    return '<div class="top"><div class="brand">'+logo()+'OneScan</div><div class="chip">'+esc((r.profile||{}).full_name||'')+'</div></div>'+
      '<div class="banner">Read-only. Entries marked "Added by patient" are not verified by a clinic. This access was recorded.</div>'+
      emCard(r.profile,r.emergency)+(r.mode==='full'?'<h2 style="margin:14px 0 4px">Medical history</h2>'+filters()+recList(r.records,true):'');
  }

  // ---------- render ----------
  function render(){
    if(S.doc){ app.innerHTML=doctorView(); return; }
    if(S.view==='auth'){ app.innerHTML=authView(); return; }
    if(S.view==='onboard'){ app.innerHTML=onboardView(); return; }
    var v={timeline:timelineView,add:addView,share:shareView,emergency:emergencyView,account:accountView}[S.view]();
    app.innerHTML=top()+v+nav();
    if(S.view==='share'&&S.share) drawQR();
  }
  function drawQR(){
    var box=document.getElementById('qrbox'); if(!box) return; clear(); box.innerHTML='';
    var link=location.origin+location.pathname+'?t='+S.share.token;
    if(typeof QRCode!=='undefined') new QRCode(box,{text:link,width:200,height:200,colorDark:'#13283B',colorLight:'#ffffff'});
    var t=setInterval(function(){
      var el=document.getElementById('cd'); if(!el){clearInterval(t);return;}
      var left=Math.max(0,Math.round((new Date(S.share.expires_at)-Date.now())/1000));
      var h=Math.floor(left/3600), m=Math.floor((left%3600)/60), s=left%60;
      el.textContent = left===0 ? 'expired' : (h?h+'h ':'')+m+'m '+String(s).padStart(2,'0')+'s';
      if(left===0) clearInterval(t);
    },500); timers.push(t);
  }
  function go(v){ if(S.view==='add') readForm(); clear(); S.view=v; S.err=''; S.msg=''; if(v==='share') refreshLogs(); render(); window.scrollTo(0,0); }
  function refreshLogs(){ sb.from('access_logs').select('*').order('created_at',{ascending:false}).limit(10).then(function(r){ S.logs=r.data||[]; if(S.view==='share'&&!S.busy) render(); }); }
  function readForm(){
    if(!S.form||!document.getElementById('f_d')) return;
    S.form.record_date=val('f_d'); S.form.record_type=val('f_t'); S.form.title=val('f_ti');
    S.form.doctor=val('f_do'); S.form.place=val('f_pl'); S.form.note=document.getElementById('f_n').value;
  }
  function readEm(){
    if(!document.getElementById('e_a')) return;
    S.emDraft={allergies:list('e_a'),conditions:list('e_c'),medications:list('e_m'),contact_name:val('e_n'),contact_phone:val('e_p')};
  }
  function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
  function list(id){ return val(id).split(',').map(function(x){return x.trim();}).filter(Boolean); }

  // resize photo to keep uploads small and inside API limits
  function shrink(file){
    return new Promise(function(res,rej){
      var img=new Image(), u=URL.createObjectURL(file);
      img.onload=function(){
        var m=1600, sc=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
        c.toBlob(function(b){ b?res(b):rej(); },'image/jpeg',0.85);
      }; img.onerror=rej; img.src=u;
    });
  }
  function b64(blob){ return new Promise(function(res){ var r=new FileReader(); r.onload=function(){res(r.result.split(',')[1]);}; r.readAsDataURL(blob); }); }

  // ---------- events ----------
  document.addEventListener('change',function(e){
    if(!e.target.matches('[data-act="photo"]')||!e.target.files[0]) return;
    var file=e.target.files[0]; S.busy=true; S.err=''; S.msg=''; S.form=null; render();
    shrink(file).then(function(blob){
      var path=S.session.user.id+'/'+Date.now()+'.jpg';
      return Promise.all([sb.storage.from('reports').upload(path,blob,{contentType:'image/jpeg'}), b64(blob)]).then(function(r){
        if(r[0].error) throw new Error('upload');
        return call('extract-report',{image_base64:r[1],media_type:'image/jpeg'}).then(function(x){
          var f=(x.ok&&x.data.fields)||{};
          S.form={record_date:f.record_date||'',record_type:['Lab','Visit','Prescription'].indexOf(f.record_type)>-1?f.record_type:'Lab',title:f.title||'',doctor:f.doctor||'',place:f.place||'',note:f.note||'',file_path:path};
          S.msg=x.ok?'Check the details below, fix anything wrong, then save.':'Could not read the photo. Fill in the details yourself.';
        });
      });
    }).catch(function(){ S.err='Something went wrong with the photo. Try again or type it in.'; })
      .then(function(){ S.busy=false; render(); });
  });

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]'); if(!el) return; var a=el.getAttribute('data-act');
    if(a==='photo') return;
    if(a==='sendcode'){
      S.email=val('em'); if(!S.email){S.err='Enter your email.';render();return;}
      S.busy=true;S.err='';render();
      sb.auth.signInWithOtp({email:S.email,options:{shouldCreateUser:true}}).then(function(r){ S.busy=false; if(r.error){S.err='Could not send the code. Check the email and try again.';} else {S.step='code';} render(); });
    }
    else if(a==='changeemail'){ S.step='email'; S.err=''; render(); }
    else if(a==='verify'){
      S.busy=true;S.err='';render();
      sb.auth.verifyOtp({email:S.email,token:val('cd').replace(/\s/g,''),type:'email'}).then(function(r){ if(r.error){ return sb.auth.verifyOtp({email:S.email,token:val('cd').replace(/\s/g,''),type:'signup'}); } return r; }).then(function(r){
        S.busy=false; if(r.error){S.err='That code is not right or has expired.';render();}
      });
    }
    else if(a==='saveprofile'){
      S.ob={name:val('fn'),dob:val('dob'),bg:val('bg'),cons:document.getElementById('cons').checked};
      if(!S.ob.name){S.err='Enter your name.';render();return;}
      if(!S.ob.cons){S.err='Please agree to continue.';render();return;}
      var uid=S.session.user.id;
      sb.from('profiles').insert({id:uid,full_name:S.ob.name,date_of_birth:S.ob.dob||null,blood_group:S.ob.bg||null,consented_at:new Date().toISOString()}).then(function(r){
        if(r.error){S.err='Could not save. Try again.';render();return;}
        return sb.from('emergency_info').insert({patient_id:uid}).then(function(){ S.view='timeline'; return loadAll(); });
      });
    }
    else if(a==='nav') go(el.getAttribute('data-to'));
    else if(a==='filter'){ S.filter=el.getAttribute('data-f'); render(); }
    else if(a==='summarize'){
      S.busy=true;render();
      call('summarize').then(function(x){ S.busy=false; S.summary=x.ok?x.data.summary:'Could not make a summary right now.'; render(); });
    }
    else if(a==='manual'){ S.form={record_date:'',record_type:'Lab',title:'',doctor:'',place:'',note:'',file_path:null}; S.msg=''; render(); }
    else if(a==='saverec'){
      readForm(); var d=S.form.record_date, t=S.form.title;
      if(!d||!t){S.err='Add a date and a title.';render();return;}
      var fp=S.form.file_path;
      S.busy=true;S.err='';
      sb.from('records').insert({patient_id:S.session.user.id,record_type:S.form.record_type,title:t,note:S.form.note,record_date:d,doctor:S.form.doctor,place:S.form.place,file_path:fp,source:'self'}).then(function(r){
        S.busy=false;
        if(r.error){S.err='Could not save. Try again.';render();return;}
        S.form=null; S.msg=''; S.summary=''; return loadAll().then(function(){ S.view='timeline'; render(); });
      });
    }
    else if(a==='viewfile'){
      var w=window.open('about:blank','_blank');
      sb.storage.from('reports').createSignedUrl(el.getAttribute('data-p'),120).then(function(r){
        if(r.data&&r.data.signedUrl){ if(w) w.location.href=r.data.signedUrl; else location.href=r.data.signedUrl; }
        else { if(w) w.close(); alert('Could not open the photo.'); }
      });
    }
    else if(a==='editem'){ S.editEm=true; S.emDraft=null; render(); }
    else if(a==='cancelem'){ S.editEm=false; S.emDraft=null; S.err=''; render(); }
    else if(a==='saveem'){
      readEm(); var row=Object.assign({patient_id:S.session.user.id,updated_at:new Date().toISOString()},S.emDraft);
      sb.from('emergency_info').upsert(row).then(function(r){ if(r.error){S.err='Could not save.';render();return;} S.emergency=row; S.editEm=false; S.emDraft=null; S.err=''; render(); });
    }
    else if(a==='mode'){ S.mode=el.getAttribute('data-m'); S.share=null; clear(); render(); }
    else if(a==='genqr'){
      S.busy=true;S.err='';render();
      call('create-share',{mode:S.mode}).then(function(x){ S.busy=false; if(!x.ok){S.err='Could not make a code. Try again.';} else {S.share=x.data;} render(); });
    }
    else if(a==='signout'){ sb.auth.signOut(); }
    else if(a==='delete'){
      if(!confirm('Delete your account and all records? This cannot be undone.')) return;
      call('delete-account').then(function(x){ if(x.ok){ sb.auth.signOut({scope:'local'}); } else { alert('Could not delete. Try again.'); } });
    }
    else if(a==='docopen'){
      var code=val('dotp'); S.doc.error='';
      call('open-share',{token:S.doc.token,otp:code}).then(function(x){
        if(x.ok){ S.doc.state='done'; S.doc.data=x.data; S.filter='All'; } else { S.doc.error=x.data.error||'Could not open.'; if(x.status!==401){S.doc.state='error';S.doc.error=x.data.error;} }
        render();
      });
    }
  });

  // ---------- boot ----------
  var params=new URLSearchParams(location.search), t=params.get('t');
  if(t){
    S.doc={state:'loading',token:t}; render();
    call('open-share',{token:t}).then(function(x){
      if(x.ok){ S.doc.state='done'; S.doc.data=x.data; }
      else if(x.data&&x.data.needs_otp){ S.doc.state='otp'; }
      else { S.doc.state='error'; S.doc.error=(x.data&&x.data.error)||'This link is not valid.'; }
      render();
    });
  } else {
    sb.auth.onAuthStateChange(function(ev,session){
      setTimeout(function(){
        S.session=session;
        var uid=session?session.user.id:null;
        if(!session){
          clear(); S.uid=null; S.view='auth'; S.step='email'; S.err=''; S.profile=null; S.emergency=null; S.records=[];
          S.summary=''; S.share=null; S.form=null; S.filter='All'; S.editEm=false; S.emDraft=null; S.logs=[]; render();
        } else if(S.uid!==uid){ S.uid=uid; loadAll(); }
      },0);
    });
    sb.auth.getSession().then(function(r){ if(!r.data.session) render(); });
  }
})();
</script>
</body>
</html>
